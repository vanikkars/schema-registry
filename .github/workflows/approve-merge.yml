name: Approve and Merge PR

on:
  issue_comment:
    types: [created, edited]

jobs:
  merge-on-approval:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write

    steps:
      - name: Check if comment is approval
        id: check-approval
        uses: actions/github-script@v7
        with:
          script: |
            const comment = context.payload.comment.body.toLowerCase();
            const isApproval = comment.includes('/approve-merge') || comment.includes('approve-merge');
            const isPR = context.payload.issue.pull_request !== undefined;

            console.log(`Comment: "${comment}"`);
            console.log(`Is approval: ${isApproval}`);
            console.log(`Is PR: ${isPR}`);

            if (isApproval && isPR) {
              core.setOutput('approved', 'true');
            } else if (!isPR) {
              console.log('ℹ️  This is not a PR, skipping');
            } else {
              console.log('ℹ️  Comment does not contain /approve-merge, skipping');
            }

      - name: Check if user has permission
        if: steps.check-approval.outputs.approved == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            const comment = context.payload.comment;
            const commenter = comment.user.login;

            console.log(`PR Author: ${pullRequest.user.login}`);
            console.log(`Commenter: ${commenter}`);
            console.log(`Comment timestamp: ${comment.created_at}`);

            // Check if commenter is PR author or has admin permission
            const { data: collaborator } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: commenter
            });

            const hasPermission = collaborator.permission === 'admin' ||
                                 collaborator.permission === 'maintain' ||
                                 pullRequest.user.login === commenter;

            if (!hasPermission) {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `❌ @${commenter} you don't have permission to approve this PR. Only PR author, maintainers, or admins can approve.`
              });
              core.setFailed('Commenter does not have permission');
              return;
            }

            console.log(`✅ ${commenter} has permission to approve`);

      - name: Merge PR
        if: steps.check-approval.outputs.approved == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            const commenter = context.payload.comment.user.login;

            if (pullRequest.state !== 'open') {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `⚠️ PR is already ${pullRequest.state}, cannot merge`
              });
              return;
            }

            try {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                merge_method: 'squash',
                commit_title: `✅ Merge approved contracts: ${pullRequest.title}`,
                commit_message: `Contracts validated and Iceberg tables created.\n\nPR: #${context.issue.number}\n\n- Schema validation passed\n- Iceberg tables created/updated successfully\n- Approved by: @${commenter}`
              });

              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## 🎉 Merge Complete\n\nPR has been successfully merged by @${commenter}!\n\nAll contract changes are now in production.`
              });

              console.log('✅ PR merged successfully');
            } catch (error) {
              if (error.message.includes('Pull Request is not mergeable')) {
                await github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: `❌ Cannot merge: PR has conflicts or does not meet branch protection rules`
                });
              } else {
                await github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: `❌ Merge failed: ${error.message}`
                });
              }
              throw error;
            }