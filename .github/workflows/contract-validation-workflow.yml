name: Contract Validation and Iceberg Provisioning

on:
  pull_request:
    paths:
      - 'contracts/current/**'
      - '.github/workflows/contract-validation-workflow.yml'
    types: [opened, synchronize, reopened]

jobs:
  validate-contracts:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pydantic jsonschema avro-python3

      - name: Find changed contract files
        id: changed-files
        run: |
          # Get the merge base to compare against
          MERGE_BASE=$(git merge-base origin/${{ github.base_ref }} HEAD)

          # Find all changed JSON files in contracts/current folder only
          CHANGED_FILES=$(git diff --name-only $MERGE_BASE HEAD -- 'contracts/current/**/*.json' | tr '\n' ' ')
          echo "files=$CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "Changed contract files (from current folder): $CHANGED_FILES"

      - name: Validate contracts against registry API
        id: validation
        env:
          REGISTRY_API_URL: ${{ secrets.REGISTRY_API_URL || 'http://localhost:8000' }}
        run: |
          python3 << 'EOF'
          import json
          import sys
          import requests
          from pathlib import Path

          changed_files = "${{ steps.changed-files.outputs.files }}".strip().split()
          registry_url = "${{ env.REGISTRY_API_URL }}"

          if not changed_files or changed_files == ['']:
              print("::notice::No contract files changed")
              sys.exit(0)

          validation_results = []
          all_passed = True

          for file_path in changed_files:
              if not file_path.endswith('.json'):
                  continue

              print(f"\n📋 Validating: {file_path}")

              try:
                  with open(file_path, 'r') as f:
                      contract = json.load(f)

                  # Validate contract has at least a 'name' field
                  if 'name' not in contract:
                      print(f"❌ Missing required field: 'name'")
                      all_passed = False
                      validation_results.append({
                          'file': file_path,
                          'status': 'FAILED',
                          'reason': "Missing required field: 'name'"
                      })
                      continue

                  # Send to registry API using PUT (idempotent, works for create or update)
                  contract_id = contract.get('contract_id', 'unknown')
                  print(f"📤 Registering contract '{contract.get('name')}' (ID: {contract_id})...")

                  try:
                      response = requests.put(
                          f"{registry_url}/api/v1/schemas/{contract_id}",
                          json=contract,
                          timeout=30
                      )

                      if response.status_code in [200, 201]:
                          is_new = response.status_code == 201
                          action = "created" if is_new else "updated"
                          print(f"✅ Contract {action} and validated by registry")
                          validation_results.append({
                              'file': file_path,
                              'status': 'PASSED',
                              'contract_name': contract.get('name'),
                              'action': action
                          })
                      else:
                          print(f"❌ Registry rejected contract: {response.status_code}")
                          print(f"Response: {response.text}")
                          all_passed = False
                          validation_results.append({
                              'file': file_path,
                              'status': 'FAILED',
                              'reason': f'Registry API returned {response.status_code}: {response.text}'
                          })

                  except requests.exceptions.ConnectionError:
                      print(f"⚠️  Could not connect to registry API at {registry_url}")
                      print("💡 Tip: Set REGISTRY_API_URL secret in GitHub settings or ensure API is running")
                      all_passed = False
                      validation_results.append({
                          'file': file_path,
                          'status': 'FAILED',
                          'reason': f'Cannot connect to registry API at {registry_url}'
                      })

              except json.JSONDecodeError as e:
                  print(f"❌ Invalid JSON: {e}")
                  all_passed = False
                  validation_results.append({
                      'file': file_path,
                      'status': 'FAILED',
                      'reason': f'Invalid JSON: {str(e)}'
                  })
              except FileNotFoundError:
                  print(f"⚠️  File not found: {file_path}")
                  print("💡 Contract may have been decommissioned. Schema kept in repo, Iceberg table retained.")
                  validation_results.append({
                      'file': file_path,
                      'status': 'SKIPPED',
                      'reason': 'File not found (decommissioned contract)'
                  })

          # Write results to file for next step
          with open('/tmp/validation_results.json', 'w') as f:
              json.dump({
                  'all_passed': all_passed,
                  'results': validation_results
              }, f)

          # Check if all are skipped or passed (skipped files don't count as failures)
          has_failures = any(r['status'] == 'FAILED' for r in validation_results)

          if has_failures:
              print("\n❌ Validation failed for some contracts")
              sys.exit(1)
          else:
              skipped_count = sum(1 for r in validation_results if r['status'] == 'SKIPPED')
              passed_count = sum(1 for r in validation_results if r['status'] == 'PASSED')

              if skipped_count > 0:
                  print(f"\n✅ Validation passed ({passed_count} validated, {skipped_count} skipped/decommissioned)")
              else:
                  print("\n✅ All contracts validated successfully")
              sys.exit(0)
          EOF

      - name: Create Iceberg tables
        id: iceberg
        if: success()
        env:
          ICEBERG_SERVICE_URL: ${{ secrets.ICEBERG_SERVICE_URL || 'http://localhost:8001' }}
        run: |
          python3 << 'EOF'
          import json
          import sys
          import requests

          changed_files = "${{ steps.changed-files.outputs.files }}".strip().split()
          iceberg_url = "${{ env.ICEBERG_SERVICE_URL }}"

          if not changed_files or changed_files == ['']:
              print("::notice::No contracts to create tables for")
              sys.exit(0)

          iceberg_results = []
          all_passed = True

          for file_path in changed_files:
              if not file_path.endswith('.json'):
                  continue

              print(f"\n📊 Processing Iceberg table: {file_path}")

              try:
                  with open(file_path, 'r') as f:
                      contract = json.load(f)

                  contract_name = contract.get('name')
                  contract_id = contract.get('contract_id', '')
                  table_name = contract_id.replace('-', '_').lower()
                  print(f"📤 Registering Iceberg table for {contract_name} (table: {table_name})...")

                  # Use PUT for idempotent create/update
                  response = requests.put(
                      f"{iceberg_url}/api/v1/tables/{table_name}",
                      json=contract,
                      timeout=30
                  )

                  if response.status_code in [200, 201]:
                      result = response.json().get('data', {})
                      status_value = result.get('status')
                      is_new = response.status_code == 201

                      if status_value == 'created' or is_new:
                          print(f"✅ Table created: {result.get('table_name')}")
                          iceberg_results.append({
                              'file': file_path,
                              'contract': contract_name,
                              'status': 'CREATED',
                              'table_name': result.get('table_name')
                          })
                      elif status_value == 'updated':
                          print(f"✅ Table updated: {result.get('table_name')}")
                          table_name_result = result.get('table_name')
                          change_summary = result.get('change_summary', {})
                          change_details = result.get('change_details', {})
                          old_version = result.get('old_version')
                          new_version = result.get('new_version')

                          print(f"   Version: {old_version} → {new_version}")

                          # Print summary
                          added_count = change_summary.get('added', 0)
                          removed_count = change_summary.get('removed', 0)
                          modified_count = change_summary.get('modified', 0)

                          if added_count > 0 or removed_count > 0 or modified_count > 0:
                              print(f"   Changes: +{added_count} -{removed_count} ~{modified_count}")

                              # Print detailed changes
                              for col in change_details.get('added_columns', []):
                                  desc = f" - {col['description']}" if col['description'] else ""
                                  print(f"     ➕ {col['name']}: {col['type']}{desc}")

                              for col in change_details.get('removed_columns', []):
                                  print(f"     ➖ {col['name']}: {col['type']}")

                              for col in change_details.get('modified_columns', []):
                                  print(f"     ✏️  {col['name']}: {col['old_type']} → {col['new_type']}")

                          iceberg_results.append({
                              'file': file_path,
                              'contract': contract_name,
                              'status': 'UPDATED',
                              'table_name': table_name_result,
                              'changes': change_summary,
                              'change_details': change_details
                          })
                      elif status_value == 'unchanged':
                          print(f"✔️  No schema changes: {result.get('table_name')}")
                          iceberg_results.append({
                              'file': file_path,
                              'contract': contract_name,
                              'status': 'UNCHANGED',
                              'table_name': result.get('table_name')
                          })
                      elif status_value == 'exists' and not is_new:
                          print(f"⏭️  Table unchanged: {result.get('table_name')}")
                          iceberg_results.append({
                              'file': file_path,
                              'contract': contract_name,
                              'status': 'UNCHANGED',
                              'table_name': result.get('table_name')
                          })
                      else:
                          print(f"❌ Unexpected response: {result}")
                          all_passed = False
                          iceberg_results.append({
                              'file': file_path,
                              'contract': contract_name,
                              'status': 'FAILED',
                              'error': 'Unexpected response'
                          })
                  else:
                      error_msg = response.text if response.text else f"HTTP {response.status_code}"
                      print(f"❌ Iceberg service returned {response.status_code}: {error_msg}")
                      all_passed = False
                      iceberg_results.append({
                          'file': file_path,
                          'contract': contract_name,
                          'status': 'FAILED',
                          'error': error_msg
                      })

              except requests.exceptions.ConnectionError:
                  print(f"⚠️  Cannot connect to Iceberg service at {iceberg_url}")
                  all_passed = False
                  iceberg_results.append({
                      'file': file_path,
                      'contract': contract.get('name', 'unknown'),
                      'status': 'CONNECTION_ERROR',
                      'error': 'Cannot reach Iceberg service'
                  })

              except FileNotFoundError:
                  print(f"⚠️  File not found: {file_path}")
                  print("💡 Contract decommissioned - Iceberg table will be retained")
                  iceberg_results.append({
                      'file': file_path,
                      'status': 'SKIPPED',
                      'error': 'File not found (decommissioned contract)'
                  })

              except json.JSONDecodeError as e:
                  print(f"❌ Invalid JSON: {e}")
                  all_passed = False
                  iceberg_results.append({
                      'file': file_path,
                      'status': 'INVALID_JSON',
                      'error': str(e)
                  })

          with open('/tmp/iceberg_results.json', 'w') as f:
              json.dump({
                  'all_passed': all_passed,
                  'results': iceberg_results
              }, f)

          # Only fail if there are actual errors, not skipped files or existing tables
          has_errors = any(r['status'] not in ['CREATED', 'EXISTS', 'UPDATED', 'UNCHANGED', 'SKIPPED'] for r in iceberg_results)

          # Also fail if there are any HTTP errors
          has_http_errors = any('HTTP' in str(r.get('error', '')) or 'http' in str(r.get('error', '')).lower() for r in iceberg_results)

          if has_http_errors:
              print("\n❌ HTTP error during Iceberg table operations")
              sys.exit(1)

          sys.exit(0 if not has_errors else 1)
          EOF

      - name: Comment validation & table creation results on PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');

            let comment = '## 📊 Validation & Table Creation Results\n\n';

            // Read validation results
            try {
              const valResults = JSON.parse(fs.readFileSync('/tmp/validation_results.json', 'utf-8'));
              comment += '### ✅ Schema Validation\n';
              comment += valResults.all_passed ? '**All contracts validated!**\n\n' : '**Validation failed**\n\n';

              comment += '| File | Status | Action |\n';
              comment += '|------|--------|--------|\n';
              valResults.results.forEach(r => {
                const statusIcon = r.status === 'PASSED' ? '✅' : r.status === 'SKIPPED' ? '⚠️' : '❌';
                const action = r.action ? r.action : (r.reason ? `${r.reason}` : '');
                comment += `| ${r.file} | ${statusIcon} ${r.status} | ${action} |\n`;
              });
              comment += '\n';
            } catch (e) {
              console.log('Could not read validation results');
            }

            // Read iceberg results
            try {
              const icebergResults = JSON.parse(fs.readFileSync('/tmp/iceberg_results.json', 'utf-8'));
              comment += '### 🗄️ Iceberg Table Creation\n';
              comment += icebergResults.all_passed ? '**All tables created successfully!**\n\n' : '**Table creation failed**\n\n';

              comment += '| Contract | Table | Status | Details |\n';
              comment += '|----------|-------|--------|----------|\n';
              icebergResults.results.forEach(r => {
                let statusIcon, statusText;
                if (r.status === 'CREATED') {
                  statusIcon = '✅';
                  statusText = 'CREATED';
                } else if (r.status === 'UPDATED') {
                  statusIcon = '✅';
                  statusText = 'UPDATED';
                } else if (r.status === 'UNCHANGED') {
                  statusIcon = '✔️';
                  statusText = 'UNCHANGED';
                } else if (r.status === 'EXISTS') {
                  statusIcon = '⚠️';
                  statusText = 'EXISTS';
                } else if (r.status === 'SKIPPED') {
                  statusIcon = '⏭️';
                  statusText = 'SKIPPED';
                } else {
                  statusIcon = '❌';
                  statusText = r.status;
                }

                let details = r.error ? ` - ${r.error}` : '';

                // Add change summary for UPDATED status
                if (r.status === 'UPDATED' && r.changes) {
                  const summary = r.changes;
                  const changeList = [];
                  if (summary.added > 0) changeList.push(`+${summary.added}`);
                  if (summary.removed > 0) changeList.push(`-${summary.removed}`);
                  if (summary.modified > 0) changeList.push(`~${summary.modified}`);
                  if (changeList.length > 0) {
                    details = changeList.join(' ');
                  }
                }

                comment += `| ${r.contract || 'N/A'} | ${r.table_name || 'N/A'} | ${statusIcon} ${statusText} | ${details} |\n`;

                // Add detailed change breakdown for UPDATED status (outside table)
                if (r.status === 'UPDATED' && r.change_details) {
                  const changes = r.change_details;

                  if (changes.added_columns && changes.added_columns.length > 0) {
                    comment += '\n**➕ Added Columns:**\n';
                    changes.added_columns.forEach(col => {
                      const desc = col.description ? ` - ${col.description}` : '';
                      comment += `- **${col.name}** (\`${col.type}\`)${desc}\n`;
                    });
                  }

                  if (changes.removed_columns && changes.removed_columns.length > 0) {
                    comment += '\n**➖ Removed Columns:**\n';
                    changes.removed_columns.forEach(col => {
                      comment += `- **${col.name}** (\`${col.type}\`)\n`;
                    });
                  }

                  if (changes.modified_columns && changes.modified_columns.length > 0) {
                    comment += '\n**✏️ Modified Columns:**\n';
                    changes.modified_columns.forEach(col => {
                      comment += `- **${col.name}**: \`${col.old_type}\` → \`${col.new_type}\`\n`;
                    });
                  }

                  comment += '\n';
                }
              });
            } catch (e) {
              console.log('Could not read iceberg results');
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Report failure if validation or table creation failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Contract Processing',
              head_sha: context.sha,
              status: 'completed',
              conclusion: 'failure',
              output: {
                title: 'Contract Processing Failed',
                summary: 'Validation or table creation failed. PR cannot be merged.',
                text: 'Check workflow logs and PR comments for details.'
              }
            });

      - name: Request human approval for merge
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Check if there are any HTTP errors in Iceberg results
            let hasHttpErrors = false;
            try {
              const icebergResults = JSON.parse(fs.readFileSync('/tmp/iceberg_results.json', 'utf-8'));
              hasHttpErrors = icebergResults.results.some(r =>
                r.error && (r.error.toUpperCase().includes('HTTP') || r.error.includes('Cannot connect'))
              );

              if (hasHttpErrors) {
                console.log('❌ HTTP error detected in Iceberg results - aborting');
                process.exit(1);
              }
            } catch (e) {
              console.log('Could not read Iceberg results');
            }

            // Build approval request comment
            let approvalComment = '## ✅ Ready for Merge\n\n';
            approvalComment += 'All validations and table creations passed successfully!\n\n';
            approvalComment += '**To merge this PR, reply with:**\n';
            approvalComment += '```\napprove-merge\n```\n\n';
            approvalComment += 'This will automatically merge the PR with all changes.\n';

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: approvalComment
            });

            console.log('✅ Approval request comment posted - waiting for /approve-merge command');

      - name: Report validation failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Schema Validation',
              head_sha: context.sha,
              status: 'completed',
              conclusion: 'failure',
              output: {
                title: 'Schema Validation Failed',
                summary: 'One or more contracts failed validation against the registry API',
                text: 'Check the workflow logs and PR comments for details.'
              }
            });