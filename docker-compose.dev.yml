version: '3.8'

# Development docker-compose with additional services
# Usage: docker-compose -f docker-compose.dev.yml up

services:
  registry-api:
    build:
      context: .
      dockerfile: registry_api/Dockerfile
    container_name: schema-registry-api-dev
    ports:
      - "8000:8000"
    environment:
      # AWS Credentials
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      # Development
      PYTHONUNBUFFERED: 1
      LOG_LEVEL: DEBUG
    env_file:
      - .env
    volumes:
      # Mount entire project for development
      - .:/app
      - /app/.venv  # Exclude venv from mount
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - schema-registry-net
    stdin_open: true
    tty: true
    labels:
      - "app=schema-registry-api-dev"
      - "environment=development"

  # PostgreSQL for future data persistence (optional)
  postgres:
    image: postgres:15-alpine
    container_name: schema-registry-postgres
    environment:
      POSTGRES_USER: registry
      POSTGRES_PASSWORD: registry_password
      POSTGRES_DB: schema_registry
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registry"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - schema-registry-net
    labels:
      - "app=schema-registry-postgres"
      - "environment=development"

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: schema-registry-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - schema-registry-net
    labels:
      - "app=schema-registry-redis"
      - "environment=development"

volumes:
  postgres_data:

networks:
  schema-registry-net:
    driver: bridge