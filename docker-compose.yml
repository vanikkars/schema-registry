version: '3.8'

services:
  registry-api:
    build:
      context: .
      dockerfile: registry-api/Dockerfile
    container_name: schema-registry-api
    ports:
      - "8000:8000"
    environment:
      # AWS Credentials
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      # Application
      PYTHONUNBUFFERED: 1
    env_file:
      - .env
    volumes:
      # Mount contracts directory for easy access
      - ./contracts:/app/contracts:ro
      # Mount logs if needed
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - schema-registry-net
    labels:
      - "app=schema-registry-api"
      - "version=1.0.0"

networks:
  schema-registry-net:
    driver: bridge
